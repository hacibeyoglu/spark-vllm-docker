# Recipe: DeepSeek V4 Flash 0731 + Vision
# Vision-enabled DeepSeek V4 Flash 0731 on dual Sparks, using the B12X serving
# stack. The vision capability is provided by the `dsv4-vision` plugin mod.
#
# PREREQUISITES (host, once, on the node that owns the HF cache):
#   1. Backbone:  ./hf-download.sh deepseek-ai/DeepSeek-V4-Flash-0731 -c
#      (or run this recipe with --setup; `model:` below downloads the backbone)
#   2. Encoder:   ./mods/dsv4-vision/download-assets.sh   (tower + adapter)
#   3. Deploy:    ./run-recipe.sh deepseek-v4-flash-0731-vision -n <head>,<worker> --setup

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-Vision
description: vLLM serving DeepSeek-V4-Flash-0731 (vision) on dual Sparks via B12X docker

# Backbone — downloaded by --setup. (Encoder assets come from the dsv4-vision
# mod, a separate HF repo.)
model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader
  - mods/dsv4-vision

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  mm_image_limit: 8
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  # --- vision encoder wiring (loaded by the dsv4-vision plugin) ---
  DSV4_VISION_TOWER: /root/.cache/huggingface/dsv4-vision-assets/tower/deepencoder_v2_tower.safetensors
  DSV4_VISION_ADAPTER: /root/.cache/huggingface/dsv4-vision-assets/adapter/merged-004800-5af0c5.pt

command: |
  vllm serve /root/.cache/huggingface/dsv4-0731-vision \
      --served-model-name deepseek-v4-flash-0731-vision \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --limit-mm-per-prompt '{{"image":{mm_image_limit}}}' \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --moe-backend b12x \
      --linear-backend b12x \
      --load-format instanttensor \
      --attention-backend B12X_MLA_SPARSE \
      --distributed-executor-backend mp \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'

